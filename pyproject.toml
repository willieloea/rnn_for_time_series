[project]
name = "assignment3"
version = "0.1.0"
description = "Time series forecasting using recurrent neural networks"
readme = "README.md"
authors = [
    { name = "Willie Loftie-Eaton", email = "willieloea@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "statsmodels>=0.15.0",
    "torch>=2.14.0",
]

[project.scripts]
assignment3 = "assignment3:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
